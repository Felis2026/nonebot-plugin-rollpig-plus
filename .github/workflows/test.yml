name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install plugin
        run: python -m pip install .

      - name: Compile sources
        run: python -m compileall -q nonebot_plugin_rollpig_plus tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
